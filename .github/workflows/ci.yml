name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all --locked

  portability-backup:
    name: Portability backup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: linux
          - os: macos-latest
            runner: macos
          - os: windows-latest
            runner: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: cargo build --locked
      - name: Create archives
        run: python .github/scripts/portability.py create portability ${{ matrix.runner }}
      - uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.runner }}
          path: portability/
          if-no-files-found: error
          retention-days: 1

  portability-restore:
    name: Portability restore
    needs: portability-backup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: linux
          - os: macos-latest
            runner: macos
          - os: windows-latest
            runner: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: cargo build --locked
      - uses: actions/download-artifact@v4
        with:
          path: portability
          merge-multiple: true
      - name: Restore archives from every platform
        run: python .github/scripts/portability.py restore portability ${{ matrix.runner }}

  resume-check:
    name: Resume check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_VERSION: "2.1.319"
      CODEX_VERSION: "0.167.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: cargo build --locked
      - name: Install pinned real CLIs
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          export CLAUDE_CONFIG_DIR="$HOME/.claude"
          export CODEX_HOME="$HOME/.codex"
          export AISESSION_BACKUP_DATA_DIR="$HOME/data"
          export NPM_CONFIG_USERCONFIG=/dev/null
          npm install --global "@anthropic-ai/claude-code@$CLAUDE_VERSION" "@openai/codex@$CODEX_VERSION"
      - name: Resume converted and restored sessions in real CLIs
        run: python .github/scripts/resume_check.py

  remote-repository:
    name: Remote repository (S3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AISESSION_BACKUP_TEST_S3_ENDPOINT: http://127.0.0.1:19000
      AWS_ACCESS_KEY_ID: aisessiontest
      AWS_SECRET_ACCESS_KEY: aisessiontest-secret
      RUSTFS_IMAGE: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start RustFS, an S3 compatible server
        run: |
          docker run -d --name rustfs -p 127.0.0.1:19000:9000 \
            -e RUSTFS_ACCESS_KEY="$AWS_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$AWS_SECRET_ACCESS_KEY" \
            "$RUSTFS_IMAGE"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19000/ || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          echo "RustFS answered with HTTP $code"
      - name: Repository contract and round trip against S3
        run: cargo test --locked --test remote_s3 --test hostile_repo -- --nocapture
      - name: Server log on failure
        if: failure()
        run: docker logs rustfs 2>&1 | tail -n 100
