[package]
name = "aisession-backup"
version = "3.3.0"
edition = "2021"
rust-version = "1.85"
description = "Backup, restore and migrate AI coding tool sessions and config across machines with plans, rollback and path remapping"
repository = "https://github.com/vynazevedo/aisession-backup"
license = "MIT"
keywords = ["ai", "session", "backup", "migration", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "aisession-backup"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
ratatui = "0.29"
crossterm = "0.28"
walkdir = "2"
anyhow = "1"
thiserror = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
regex = "1"
age = "0.11"
rpassword = "7"
clap_complete = "4"
owo-colors = { version = "4", features = ["supports-colors"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
